version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # Base de Datos PostgreSQL (Database-per-Service Pattern)
  # ═══════════════════════════════════════════════════════════
  db-activos:
    image: postgres:15-alpine
    container_name: db-activos
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - activos_pg_data:/var/lib/postgresql/data
      - ./app/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════
  # MySQL Legacy (Solo para migración de datos del SGCAF)
  # Carga automáticamente el dump sgcaf.sql al iniciar
  # ═══════════════════════════════════════════════════════════
  mysql-legacy:
    image: mysql:5.7
    container_name: mysql-legacy
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: legacy_root_2026
      MYSQL_DATABASE: sgcaf
    expose:
      - "3306"
    volumes:
      - ./sgcaf.sql:/docker-entrypoint-initdb.d/sgcaf.sql
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plegacy_root_2026"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ═══════════════════════════════════════════════════════════
  # Backend API (Node.js + Express)
  # ═══════════════════════════════════════════════════════════
  servicio-activos:
    build: ./app/backend
    container_name: servicio-activos
    restart: always
    depends_on:
      db-activos:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - API_URL=${API_URL}
      - MYSQL_LEGACY_HOST=mysql-legacy
      - MYSQL_LEGACY_PORT=3306
      - MYSQL_LEGACY_USER=root
      - MYSQL_LEGACY_PASSWORD=legacy_root_2026
      - MYSQL_LEGACY_DATABASE=sgcaf
    expose:
      - "4002"
    networks:
      - microservices_net

  # ═══════════════════════════════════════════════════════════
  # Frontend Web (React + Vite → Nginx Static)
  # ═══════════════════════════════════════════════════════════
  servicio-activos-web:
    build: ./app/frontend
    container_name: servicio-activos-web
    restart: always
    depends_on:
      - servicio-activos
    expose:
      - "80"
    networks:
      - microservices_net

volumes:
  activos_pg_data:

networks:
  microservices_net:
    driver: bridge
