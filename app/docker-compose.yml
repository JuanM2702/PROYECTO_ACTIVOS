version: '3.8'

services:
  # Base de Datos PostgreSQL
  db-activos:
    image: postgres:15-alpine
    container_name: activos_db
    restart: always
    shm_size: 128mb
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - activos_pg_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Node.js (Express + pg client)
  backend-activos:
    build:
      context: ./backend
    container_name: activos_backend
    restart: always
    depends_on:
      db-activos:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - PORT=${PORT}
      - DB_HOST=db-activos
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "4002:4002"
    volumes:
      - ./backend/src:/app/src

  # Panel Web React (Vite)
  web-activos:
    build:
      context: ./frontend
    container_name: activos_web
    restart: always
    depends_on:
      - backend-activos
    environment:
      - VITE_API_URL=http://2.25.212.78:4002
    ports:
      - "5175:5175"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  activos_pg_data:
